<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Especificidade CSS</title>
    <style>
        /* https://developer.mozilla.org/pt-BR/docs/Web/CSS/Specificity */
        /* 
            EM LINHAS GERAIS...

            1. REGRA COM !IMPORTANT
            2. SELETORES MAIS ESPECÍFICOS
            3. ÚLTIMA REGRA PROCESSADA (EMPATE)
        */
        p {
            background-color: #aaa;
        }

        .observacao {
            background-color: #5F5;
            border: dashed 5px;
            padding: 200px !important; /* o uso de !important não é nada interessante */
            font-size: 40px;
        }

        p.observacao {
            padding: 2px;
            background: linear-gradient(to right, violet, indigo, blue, green, yellow, orange, red);
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <p class='observacao'>Olha essa observação!!!!</p>
</body>

</html>
