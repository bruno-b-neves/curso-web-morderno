<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="css/tag.css">
    <style>
        /* * - seletor universal */
        /* div - seletor do elemento html*/
        /* . - seletor de classe */
        /* # - seletor de id */
        /* # || . || elem > div - quero pegar o que está diretamente(>) dentro # || . || elem  */
        /* p + ul -  seletores de irmãos sibling que são adjacentes */
        /* p ~ ol - seletores general siblig */
        /* [feira=casa] */
        /* [feira~=escritorio] */
        /* [feira*=asa] */
        /* span:nth-child(1) */
        /* section > :nth-child(odd) */ /* os filhos impares */
        /* section > :nth-child(even) */ /* os filhos pares */
        /* section > span:nth-of-type(2) */ /* o segundo do typo span */
        section > span:nth-of-type(2){
            color: #ff0;
            background-color: #f77;
        }
    </style>
</head>

<body>
    <div class='tag'>
        <div class='tag'>
            <p class='tag'>1</p>
            <ul class='tag' feira='casa'>
                <li>Arroz</li>
                <li>Feijão</li>
            </ul>
            <ul class='tag' feira='escritorio empresa'>
                <li>Café</li>
                <li>Água</li>
            </ul>
            <ol id='aprovados' class='tag'>
                <li>Maria</li>
                <li>Pedro</li>
                <li>Ana</li>
            </ol>
            <div id='aninhado' class='tag'>
                <div class="tag">
                    <section class='tag nolabel'>
                        <span class='tag'>1</span>
                        <p class='tag'>2</p>
                        <span class='tag'>3</span>
                    </section>
                </div>
            </div>
        </div>
    </div>
    <script src="js/tag.js"></script>
</body>

</html>
